[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-audit"
version = "0.1.0"
description = "See what the public internet can tie back to YOUR email, phone and usernames, and how to clean it up."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exposure-audit = "exposure_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exposure_audit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
